<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><text x="10" y="30" font-size="18">Known: L-middle-top=K; L-pinky-top=T.</text><text x="10" y="60" font-size="18">A=L-index-top, B=L-pinky-bottom, C=R-index-top-in</text><text x="10" y="90" font-size="18">A,B,C are P,Q,R unordered.</text><text x="10" y="120" font-size="18">This press A+B+K+T. Next A+C+K+T, then B+C+K+T.</text></svg>