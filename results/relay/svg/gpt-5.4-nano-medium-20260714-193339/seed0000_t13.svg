<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='white'/><text x='25' y='70' font-size='28' font-family='Arial'>T13: lock L-pinky-top=Y</text><text x='25' y='120' font-size='24' font-family='Arial'>Press: L-middle-home, L-ring-home,</text><text x='25' y='160' font-size='24' font-family='Arial'>R-index-home (plus L-pinky-top)</text><text x='25' y='240' font-size='20' font-family='Arial'>Last turn set {B,J,L,R} on</text><text x='25' y='275' font-size='20' font-family='Arial'>L-middle-home/L-ring-home/R-pinky-top/R-index-home</text><text x='25' y='340' font-size='20' font-family='Arial'>So missing symbol from that set reveals</text><text x='25' y='375' font-size='20' font-family='Arial'>R-pinky-top in next deductions</text></svg>