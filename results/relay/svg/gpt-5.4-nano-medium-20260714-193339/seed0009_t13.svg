<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><text x='20' y='60' font-size='22' font-family='monospace'>From turns:</text><text x='20' y='100' font-size='20' font-family='monospace'>R-index-top-in = J</text><text x='20' y='135' font-size='20' font-family='monospace'>R-index-home-in = U</text><text x='20' y='180' font-size='18' font-family='monospace'>LM-top, LR-home, RM-home are {O,X,Y}</text><text x='20' y='230' font-size='18' font-family='monospace'>Pressing (turn13): LM-top LR-home + J-key + U-key</text></svg>