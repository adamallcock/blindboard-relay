<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><text x='20' y='80' font-size='28' font-family='Arial'>Use last set Sprev={F,M,X,Z} from turn14 chord.</text><text x='20' y='140' font-size='28' font-family='Arial'>Now press: LIH, LRH, LMH, RIH.</text><text x='20' y='200' font-size='28' font-family='Arial'>RIH symbol = element in new set not in Sprev.</text><text x='20' y='260' font-size='28' font-family='Arial'>Missing from Sprev -> RMH.</text></svg>