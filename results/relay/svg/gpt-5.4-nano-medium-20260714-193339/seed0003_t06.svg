<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='white'/><text x='20' y='60' font-size='22' font-family='Arial'>Deductions</text><text x='20' y='110' font-size='18' font-family='Arial'>R-index-home = O</text><text x='20' y='150' font-size='18' font-family='Arial'>R-middle-home = F</text><text x='20' y='200' font-size='18' font-family='Arial'>L-index-bottom-in, L-pinky-bottom,</text><text x='20' y='235' font-size='18' font-family='Arial'>R-pinky-top are {G,P,R}.</text><text x='20' y='300' font-size='18' font-family='Arial'>Turn6 presses:</text><text x='20' y='335' font-size='18' font-family='Arial'>L-i-b-in + L-p-b + R-m-home + R-i-home</text></svg>