<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' fill='white'/><text x='20' y='60' font-size='28' font-family='Arial'>T15</text><text x='20' y='110' font-size='22' font-family='Arial'>R-pinky-top = J (locked)</text><text x='20' y='150' font-size='22' font-family='Arial'>From last turn:</text><text x='20' y='190' font-size='22' font-family='Arial'>L-pinky-top, L-middle-home, L-ring-home are {L,R,Y}</text><text x='20' y='240' font-size='20' font-family='Arial'>This turn press: L-pinky-top + L-middle-home + R-pinky-top + R-ring-home</text></svg>