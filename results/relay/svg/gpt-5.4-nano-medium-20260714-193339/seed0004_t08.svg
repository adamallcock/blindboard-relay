<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' fill='white'/><text x='20' y='60' font-size='28' font-family='Arial'>Known: L-index-home = R</text><text x='20' y='110' font-size='24' font-family='Arial'>Turn8 chord: L-index-home, L-ring-home, R-ring-home, L-ring-top</text><text x='20' y='155' font-size='22' font-family='Arial'>Use set-difference vs last chord</text><text x='20' y='195' font-size='22' font-family='Arial'>to identify L-ring-top letter.</text></svg>