<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><text x='20' y='60' font-size='20'>From last turn: pressed L-pinky-home,R-pinky-top,L-index-home,L-ring-home</text><text x='20' y='100' font-size='20'>letters {B,L,P,S} and L-pinky-home=S</text><text x='20' y='140' font-size='20'>So R-pinky-top=P; L-middle-home=F</text><text x='20' y='180' font-size='20'>L-index-home/L-ring-home={B,L}</text><text x='20' y='220' font-size='20'>Rot after last turn: L-middle-top,L-pinky-home,R-index-top-in</text></svg>